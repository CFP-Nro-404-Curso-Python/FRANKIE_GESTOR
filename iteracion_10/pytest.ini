# ===============================================
#  CONFIGURACIÓN DEL ENTORNO DE PRUEBAS (PYTEST)
# ===============================================



[pytest]
# Le indica a Pytest que el directorio actual (.) es la raíz del proyecto.
# Esto soluciona el "ModuleNotFoundError" permitiendo que las importaciones 
# absolutas como 'from src.dominio...' funcionen perfectamente.
pythonpath = .

# Muestra un resumen detallado de los tests al finalizar.
addopts = -ra -q